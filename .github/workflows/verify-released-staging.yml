name: Verify an existing staging release

# Manual sampling only. A periodic ping would keep the free instance awake.
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Deploy staging run ID whose deployed version should still be live
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: colearnx-v1.0/.node-version
      - name: Identify the artifact from the successful release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/selected-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '.repository.full_name == $repo and .head_repository.full_name == $repo
            and .head_branch == "main" and .event == "workflow_dispatch" and .status == "completed"
            and .conclusion == "success" and .path == ".github/workflows/deploy-staging.yml"
            and (.head_sha | test("^[a-f0-9]{40}$")) and (.run_attempt >= 1)' "$RUNNER_TEMP/selected-run.json" >/dev/null
          sha=$(jq -r .head_sha "$RUNNER_TEMP/selected-run.json")
          attempt=$(jq -r .run_attempt "$RUNNER_TEMP/selected-run.json")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=staging-release-$sha-$RUN_ID-$attempt" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          name: ${{ steps.release.outputs.artifact }}
          path: ${{ runner.temp }}/published
      - name: Sample API latency and check the release against the live site
        working-directory: colearnx-v1.0
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-report dist
          cp "$RUNNER_TEMP/published/release-report/plan.json" release-report/plan.json
          cp "$RUNNER_TEMP/published/dist/release.json" dist/release.json
          for probe in initial subsequent; do
            curl --fail --silent --show-error --max-time 60 -o /dev/null \
              --write-out "$probe HTTP %{http_code} total=%{time_total}s\n" \
              https://api-staging.colearnx.net/health/ready | tee -a release-report/timings.txt
          done
          node scripts/deployment/smoke.mjs --planned
          cat release-report/timings.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain observation without publishing anything
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            colearnx-v1.0/release-report/timings.txt
            colearnx-v1.0/release-report/smoke-full.json
          if-no-files-found: warn
          retention-days: 14
