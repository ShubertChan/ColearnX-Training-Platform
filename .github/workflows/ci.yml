name: CoLearnX CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      pages_artifact:
        description: Tested frontend artifact from this exact run
        value: ${{ jobs.validate.outputs.pages_artifact }}

permissions:
  contents: read

jobs:
  secrets:
    name: Scan commit history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (all reachable commits, redacted output)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact=100 --no-banner --log-opts='--no-textconv HEAD' .
      - name: Scan the exact tracked tree, including merge-only changes
        run: |
          mkdir "$RUNNER_TEMP/tracked"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked"
          docker run --rm -v "$RUNNER_TEMP/tracked:/src:ro" -w /src \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir --redact=100 --no-banner .

  supply-chain:
    name: Audit and inventory ${{ matrix.component }}
    needs: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, api, video-worker, media-gateway, deployment]
    defaults:
      run:
        working-directory: colearnx-v1.0
    env:
      COMPONENT: ${{ matrix.component }}
      AUDIT_REPORT_DIR: ${{ github.workspace }}/colearnx-v1.0/release-report/security
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: colearnx-v1.0/.node-version
      - run: npm run security:audit -- --component "$COMPONENT"
      - name: Generate CycloneDX from the same lockfile, including development tools
        if: success() || failure()
        run: npm run security:sbom -- "$COMPONENT"
      - name: Keep audit and inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: supply-chain-${{ matrix.component }}-${{ github.sha }}-${{ github.run_attempt }}
          path: colearnx-v1.0/release-report/security
          if-no-files-found: error
          retention-days: 14

  sast:
    name: CodeQL JavaScript and TypeScript
    needs: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        id: codeql
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          output: ${{ runner.temp }}/sarif
          upload: never
          upload-database: false
      - name: Compare to the base revision using the same security queries
        env:
          CODEQL: ${{ steps.codeql.outputs.codeql-path }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$(git rev-parse HEAD^1); fi
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          mkdir "$RUNNER_TEMP/base-src" "$RUNNER_TEMP/base-sarif"
          git archive "$base" | tar -x -C "$RUNNER_TEMP/base-src"
          "$CODEQL" database create "$RUNNER_TEMP/base-db" --language=javascript-typescript \
            --build-mode=none --threads=2 --ram=4096 --source-root="$RUNNER_TEMP/base-src"
          "$CODEQL" database analyze "$RUNNER_TEMP/base-db" \
            codeql/javascript-queries:codeql-suites/javascript-security-extended.qls \
            --format=sarifv2.1.0 --sarif-group-rules-by-pack --threads=2 --ram=4096 \
            --output="$RUNNER_TEMP/base-sarif/javascript.sarif"
          echo "CodeQL comparison: $base → $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          node colearnx-v1.0/scripts/deployment/codeql-gate.mjs "$RUNNER_TEMP/sarif" "$RUNNER_TEMP/base-sarif"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sarif
            ${{ runner.temp }}/base-sarif
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Tests and production builds
    needs: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      clamav:
        image: clamav/clamav:1.4
        ports: ['3310:3310']
        options: --health-cmd "clamdscan --ping=1" --health-interval 10s --health-timeout 5s --health-retries 24
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: release_owner
          # Disposable runner-local test credential; never a cloud password.
          POSTGRES_PASSWORD: ci-local-fixture-only
          POSTGRES_DB: colearnx_release_check_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_owner -d colearnx_release_check_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: colearnx-v1.0
    outputs:
      pages_artifact: pages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: colearnx-v1.0/.node-version
          cache: npm
          cache-dependency-path: |
            colearnx-v1.0/package-lock.json
            colearnx-v1.0/apps/api/package-lock.json
            colearnx-v1.0/apps/video-worker/package-lock.json
            colearnx-v1.0/apps/media-gateway/package-lock.json
            colearnx-v1.0/deployment/package-lock.json
      - name: Record Node runtime used for validation
        run: node --version
      - name: Install frontend dependencies
        run: npm ci --include=dev
      - name: Install API dependencies
        run: npm --prefix apps/api ci --include=dev
      - name: Install video service and pinned deployment dependencies without cloud secrets
        run: |
          npm --prefix apps/video-worker ci --include=dev
          npm --prefix apps/media-gateway ci --include=dev
          npm --prefix deployment ci --ignore-scripts
      - name: Deployment script tests (mock network only, including cloud ledger and component planning)
        run: npm run release:test
      - name: Frontend tests
        run: npm test
      - name: Lint application and deployment sources
        run: npm run lint
      - name: Translation catalog
        run: npm run check:i18n
      - name: Frontend component tests
        run: npm run test:components
      - name: API tests
        env:
          CLAMAV_TEST_HOST: 127.0.0.1
        run: npm run api:test
      - name: Shared rate limit and alert deduplication across two Redis clients
        run: node --import tsx scripts/security-redis-check.mjs
        working-directory: colearnx-v1.0/apps/api
      - name: API type check
        run: npm run api:typecheck
      - name: Video Worker and gateway type checks (no deployment)
        run: |
          npm --prefix apps/video-worker run typecheck
          npm --prefix apps/media-gateway run typecheck
      - name: Video Worker and gateway unit tests (no cloud services)
        run: |
          npm --prefix apps/video-worker test
          npm --prefix apps/media-gateway test
      - name: Isolated PostgreSQL 16 migrations, data preservation and permissions
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RELEASE_CHECK_DATABASE_URL: postgresql://release_owner:ci-local-fixture-only@127.0.0.1:5432/colearnx_release_check_ci
        run: |
          fixture_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{println .IPAddress}}{{end}}' "$POSTGRES_CONTAINER")
          test -n "$fixture_ip"
          W10_FIXTURE_POSTGRES_IP="$fixture_ip" npm run release:database-test
      - name: Keep measured recovery times from the isolated key rotation drill
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w10-rotation-${{ github.sha }}-${{ github.run_attempt }}
          path: colearnx-v1.0/release-report/security-w10/rotation.json
          if-no-files-found: error
          retention-days: 14
      - name: Real restricted-login upload retry and scheduled-video integration checks
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          CLAMAV_TEST_HOST: 127.0.0.1
          RELEASE_CHECK_DATABASE_URL: postgresql://release_owner:ci-local-fixture-only@127.0.0.1:5432/colearnx_release_check_upload_retry_ci
          VIDEO_START_CHECK_DATABASE_URL: postgresql://release_owner:ci-local-fixture-only@127.0.0.1:5432/colearnx_release_check_video_ci
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U release_owner colearnx_release_check_upload_retry_ci
          docker exec "$POSTGRES_CONTAINER" createdb -U release_owner colearnx_release_check_video_ci
          npm --prefix apps/api run test:integration:upload-retry
          cd apps/api
          node --import tsx scripts/video-start-integration-check.mjs
      - name: Browser regression checks against local fixtures only
        run: |
          npm exec -- playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium
      - name: Build API
        run: npm run api:build
      - name: Build frontend with canonical staging configuration
        run: npm run release:build
      - name: Verify frontend artifact
        run: npm run release:verify
      - name: Save tested frontend artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: colearnx-v1.0/dist
          if-no-files-found: error
          retention-days: 7
