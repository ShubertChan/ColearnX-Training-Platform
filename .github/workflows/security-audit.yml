name: Dependency security audit

on:
  schedule:
    # 09:37 Asia/Shanghai, every day. Avoid the busy start of the hour.
    - cron: '37 1 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/dependabot.yml
      - .github/workflows/security-audit.yml
      - colearnx-v1.0/.node-version
      - colearnx-v1.0/package.json
      - colearnx-v1.0/**/package-lock.json
      - colearnx-v1.0/scripts/deployment/security-audit*
  push:
    branches: [main]
    paths:
      - .github/dependabot.yml
      - .github/workflows/security-audit.yml
      - colearnx-v1.0/.node-version
      - colearnx-v1.0/package.json
      - colearnx-v1.0/**/package-lock.json
      - colearnx-v1.0/scripts/deployment/security-audit*

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # One vulnerable or unreachable tree must not cancel the other reports.
      fail-fast: false
      max-parallel: 3
      matrix:
        component: [frontend, api, video-worker, media-gateway, deployment]
    defaults:
      run:
        working-directory: colearnx-v1.0
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: colearnx-v1.0/.node-version
      - name: Audit the complete lockfile without installing dependencies
        env:
          AUDIT_REPORT_DIR: ${{ runner.temp }}/dependency-audit
        run: npm run security:audit -- --component "${{ matrix.component }}"
      - name: Keep the report even when the audit fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-audit
          if-no-files-found: warn
          retention-days: 14
