name: Deploy staging

# Deliberately manual. PRs and pushes only run CI; they cannot publish.
on:
  workflow_dispatch:
    inputs:
      migrations_reviewed:
        description: I approved required cloud migrations separately (read-only ledger verification is also mandatory; never migrates or seeds)
        required: true
        type: boolean
        default: false
      last_applied_migration:
        description: Exact approved final migration filename (must also match the actual read-only cloud ledger)
        required: true
        type: string
      external_components_reviewed:
        description: I separately reviewed/deployed any gateway or local video changes; this workflow cannot publish those components
        type: boolean
        default: false
      force_web_release:
        description: Redeploy both web components even when no relevant runtime changes are detected (does not bypass any gates)
        type: boolean
        default: false

permissions:
  contents: read

# Do not interrupt a release between publishing the API and the frontend.
concurrency:
  group: colearnx-staging-release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: colearnx-v1.0/.node-version
      - name: Require current main and exact migration acknowledgement
        env:
          MIGRATIONS_REVIEWED: ${{ inputs.migrations_reviewed }}
          LAST_APPLIED_MIGRATION: ${{ inputs.last_applied_migration }}
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node colearnx-v1.0/scripts/deployment/source-guard.mjs

  validate:
    needs: guard
    uses: ./.github/workflows/ci.yml
    # No secrets are passed to install, test, or build steps.

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: staging
      url: https://staging.colearnx.net
    defaults:
      run:
        working-directory: colearnx-v1.0
    env:
      RELEASE_SHA: ${{ github.sha }}
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: colearnx-v1.0/.node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.validate.outputs.pages_artifact }}
          path: colearnx-v1.0/dist
      - name: Verify exact artifact before any deployment
        run: npm run release:verify
      - name: Install lockfile-pinned Pages CLI before providing platform secrets
        run: npm --prefix deployment ci --ignore-scripts
      - name: Reject a stale queued release before changing either platform
        env:
          MIGRATIONS_REVIEWED: ${{ inputs.migrations_reviewed }}
          LAST_APPLIED_MIGRATION: ${{ inputs.last_applied_migration }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deployment/source-guard.mjs
      - name: Verify actual cloud migration ledger without executing migrations
        env:
          MIGRATIONS_REVIEWED: ${{ inputs.migrations_reviewed }}
          LAST_APPLIED_MIGRATION: ${{ inputs.last_applied_migration }}
          STAGING_DATABASE_READONLY_URL: ${{ secrets.STAGING_DATABASE_READONLY_URL }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
        run: node scripts/deployment/cloud-migrations.mjs before
      - name: Verify existing Pages target before changing Render
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deployment/pages-preflight.mjs
      - name: Read actual Render baseline without deploying
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: node scripts/deployment/render-deploy.mjs --inspect-only
      - name: Plan changed components against their deployed baselines
        id: plan
        env:
          MEDIA_GATEWAY_DEPLOYED_SHA: ${{ vars.MEDIA_GATEWAY_DEPLOYED_SHA }}
          VIDEO_WORKER_DEPLOYED_SHA: ${{ vars.VIDEO_WORKER_DEPLOYED_SHA }}
          EXTERNAL_COMPONENTS_REVIEWED: ${{ inputs.external_components_reviewed }}
          FORCE_WEB_RELEASE: ${{ inputs.force_web_release }}
        run: node scripts/deployment/release-plan.mjs
      - name: Deploy Render API at the tested commit and wait for live
        if: steps.plan.outputs.api_required == 'true'
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          EXPECTED_RENDER_DEPLOY_ID: ${{ steps.plan.outputs.previous_api_deploy_id }}
          EXPECTED_RENDER_SHA: ${{ steps.plan.outputs.previous_api_sha }}
        run: node scripts/deployment/render-deploy.mjs
      - name: Check API, database connectivity, and canonical CORS
        run: npm run release:smoke -- --api-only
      - name: Confirm Render serves the planned component SHA (including retained API)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RELEASE_SHA: ${{ steps.plan.outputs.expected_api_sha }}
          EXPECTED_RENDER_DEPLOY_ID: ${{ steps.render.outputs.render_deploy_id || steps.plan.outputs.previous_api_deploy_id }}
          EXPECTED_RENDER_SHA: ${{ steps.plan.outputs.expected_api_sha }}
        run: node scripts/deployment/render-deploy.mjs --verify-only
      - name: Reject a competing Pages publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deployment/pages-preflight.mjs --verify-unchanged
      - name: Publish tested artifact to the existing Pages project
        if: steps.plan.outputs.frontend_required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        # Install and verify the reviewed exact CLI version from deployment/package-lock.json.
        run: node scripts/deployment/pages-deploy.mjs
      - name: Verify published version, assets, and API
        run: npm run release:smoke -- --planned
      - name: Confirm a retained Pages deployment was not replaced during verification
        if: steps.plan.outputs.frontend_required == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deployment/pages-preflight.mjs --verify-unchanged
      - name: Recheck actual migration ledger did not change during publication
        env:
          MIGRATIONS_REVIEWED: ${{ inputs.migrations_reviewed }}
          LAST_APPLIED_MIGRATION: ${{ inputs.last_applied_migration }}
          STAGING_DATABASE_READONLY_URL: ${{ secrets.STAGING_DATABASE_READONLY_URL }}
          STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
        run: node scripts/deployment/cloud-migrations.mjs after
      - name: Verify final backend identity
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RELEASE_SHA: ${{ steps.plan.outputs.expected_api_sha }}
          EXPECTED_RENDER_DEPLOY_ID: ${{ steps.render.outputs.render_deploy_id || steps.plan.outputs.previous_api_deploy_id }}
          EXPECTED_RENDER_SHA: ${{ steps.plan.outputs.expected_api_sha }}
        run: node scripts/deployment/render-deploy.mjs --verify-only
      - name: Write release summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.render_deploy_id }}
          RENDER_PREVIOUS_DEPLOY_ID: ${{ steps.render.outputs.render_previous_deploy_id }}
          RENDER_PREVIOUS_COMMIT_SHA: ${{ steps.render.outputs.render_previous_commit_sha }}
        run: node scripts/deployment/release-summary.mjs
      - name: Keep non-secret deployment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            colearnx-v1.0/release-report
            colearnx-v1.0/dist/release.json
          if-no-files-found: warn
          retention-days: 14
