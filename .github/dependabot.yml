version: 2

# Team members open dependency PRs. The zero limits disable version-update PRs.
# The repository's "Dependabot security updates" setting controls security PRs separately.
updates:
  - package-ecosystem: npm
    directories:
      - /colearnx-v1.0
      - /colearnx-v1.0/apps/api
      - /colearnx-v1.0/apps/video-worker
      - /colearnx-v1.0/apps/media-gateway
      - /colearnx-v1.0/deployment
    schedule:
      interval: weekly
      day: monday
      time: "10:17"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:47"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
