# W8 clamd configuration for the `clamav` compose service (profile "scan").
# Mounted over the image's /etc/clamav/clamd.conf.
Foreground yes
LogTime yes
LogFile /dev/stdout
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

# The API streams uploads with INSTREAM. clamd's default limit (25 MB) is below
# CONTENT_VIDEO_UPLOAD_MAX_BYTES (100 MB); a stream over the limit is answered
# with an error, which the API treats as "scanner unavailable" and fails closed.
StreamMaxLength 110M
MaxFileSize 110M
# Archive unpacking limits. The API already rejects bombs before scanning
# (zip-inspection.ts); these bound clamd's own work on nested archives.
MaxScanSize 512M
MaxRecursion 16
MaxFiles 10000

# Report encrypted archives/documents as findings rather than skipping them.
AlertEncrypted yes
AlertOLE2Macros yes
