# W8 clamd configuration for the `clamav` compose service (profile "scan").
# Mounted over the image's /etc/clamav/clamd.conf.
Foreground yes
LogTime yes
LogFile /dev/stdout
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0

# The API streams uploads with INSTREAM. clamd's default limit (25 MB) is below
# CONTENT_VIDEO_UPLOAD_MAX_BYTES (100 MB); a stream over the limit is answered
# with an error, which the API treats as "scanner unavailable" and fails closed.
StreamMaxLength 110M
MaxFileSize 110M
# Archive unpacking limits, set ABOVE the API's own inspection limits
# (zip-inspection.ts: 100 MiB per entry, 512 MiB per archive) so that anything
# the API lets through is small enough for clamd to scan completely.
MaxScanSize 600M
MaxRecursion 16
MaxFiles 10000

# By default clamd SKIPS content over these limits and still answers "OK".
# Report it instead (Heuristics.Limits.Exceeded); the API refuses such a file
# as "could not be cleared" rather than accepting it unscanned.
AlertExceedsMax yes

# Encrypted zips are already refused by the API before scanning. Leaving
# AlertEncrypted off keeps ordinary owner-password PDFs (print/copy
# restrictions) from being reported as findings.
AlertEncrypted no
# Macro-bearing legacy Office files (e.g. a .doc inside a course zip) are
# refused as a policy finding (Heuristics.OLE2.ContainsMacros).
AlertOLE2Macros yes
