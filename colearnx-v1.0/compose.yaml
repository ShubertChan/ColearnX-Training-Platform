services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-colearnx}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-colearnx_owner}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      COLEARNX_APP_PASSWORD: ${COLEARNX_APP_PASSWORD:?Set COLEARNX_APP_PASSWORD in .env}
      COLEARNX_MIGRATOR_PASSWORD: ${COLEARNX_MIGRATOR_PASSWORD:?Set COLEARNX_MIGRATOR_PASSWORD in .env}
      COLEARNX_READONLY_PASSWORD: ${COLEARNX_READONLY_PASSWORD:?Set COLEARNX_READONLY_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - colearnx_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Provisioned in W2 so the stack is complete when the distributed rate
  # limiter lands in W5. Bound to loopback and holding no durable data -- it
  # must never be reachable from outside the host.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # W8 malware scanning. Behind a profile because the image downloads several
  # hundred MB of signatures and takes a few minutes before it answers:
  #   docker compose --profile scan up -d clamav
  # then set UPLOAD_MALWARE_SCANNER=clamav for the API. Loopback only: clamd
  # has no authentication.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - colearnx_clamav:/var/lib/clamav
      # Raises StreamMaxLength above the 100 MB video limit; clamd's 25 MB
      # default would make every large upload fail closed.
      - ./deploy/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    # The image ships its own HEALTHCHECK (clamd PING/PONG).

volumes:
  colearnx_pgdata:
  colearnx_clamav:
